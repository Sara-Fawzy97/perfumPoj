<div class="flex items-center gap-1 text-[12px]">
  <span class="text-stone-500 font-normal">Sort by:</span>
  <div class="relative inline-block">
    <select
      id="product-sort-select"
      [value]="selectedSort()"
      (change)="onChange($event)"
      class="appearance-none bg-transparent pl-1 pr-5 py-1 text-stone-800 hover:text-stone-950 font-medium text-[12px] focus:outline-none cursor-pointer"
    >
      <option value="price-desc">Price: High to Low</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="featured">Featured Curations</option>
      <option value="rating">Highest Rated</option>
      <option value="name-asc">Alphabetical</option>
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-stone-500">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>
</div>
