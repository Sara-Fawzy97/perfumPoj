<div class="group bg-white p-4 flex flex-col justify-between h-full transition-shadow duration-300">
  <!-- Image Container -->
  <a [routerLink]="['/products', product().id]" class="block relative w-full aspect-[276/320] bg-stone-100 overflow-hidden cursor-pointer">
    <img
      [src]="product().imageUrl"
      [alt]="product().name"
      loading="lazy"
      class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out"
    />
  </a>

  <!-- Details Content -->
  <div class="pt-4 flex flex-col justify-between flex-1">
    <div>
      <div class="flex items-baseline justify-between gap-3">
        <h3 class="font-serif text-[18px] leading-snug text-stone-900 font-normal">
          <a [routerLink]="['/products', product().id]" class="hover:text-stone-600 transition-colors">
            {{ product().name }}
          </a>
        </h3>
        <span class="text-[15px] font-normal text-stone-900 tracking-tight whitespace-nowrap">
          ${{ product().price }}
        </span>
      </div>

      <p class="text-[10px] tracking-[0.15em] uppercase text-stone-400 font-medium mt-1.5 line-clamp-1">
        {{ product().scentProfile }}
      </p>
    </div>

    <!-- Add to Cart Action -->
    <button
      type="button"
      (click)="onAddToCart($event)"
      class="mt-4 w-full py-2.5 px-4 bg-transparent border border-stone-200 hover:border-stone-900 hover:bg-stone-900 hover:text-white text-stone-900 text-[11px] font-medium tracking-[0.16em] uppercase transition-all duration-200 text-center cursor-pointer"
    >
      ADD TO CART +
    </button>
  </div>
</div>
