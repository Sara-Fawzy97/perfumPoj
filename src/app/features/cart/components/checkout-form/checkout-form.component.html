<div>
  <h1 class="font-serif text-4xl text-stone-900 mb-2">Checkout</h1>
  <p class="text-sm text-stone-500 mb-8">Complete your delivery details to place your order.</p>

  <div>
    <h2 class="font-serif text-2xl text-stone-900 mb-6">Delivery details</h2>

    <div class="space-y-5">
      <!-- Recipient Name -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="recipientName">
          Recipient Name
        </label>
        <input
          id="recipientName"
          type="text"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400"
          placeholder="Amelia Hart"
          [value]="recipientName()"
          (input)="recipientName.set($any($event.target).value)"
        />
      </div>

      <!-- Phone Number -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="phoneNumber">
          Phone Number
        </label>
        <input
          id="phoneNumber"
          type="tel"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400"
          placeholder="+1 212 555 0148"
          [value]="phoneNumber()"
          (input)="onPhoneChange($any($event.target).value)"
        />
        @if (phoneVerified()) {
          <span class="text-xs text-emerald-600 flex items-center gap-1">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" class="shrink-0">
              <path d="M2 6L4.5 8.5L10 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Phone number verified
          </span>
        }
      </div>

      <!-- Delivery Address -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="deliveryAddress">
          Delivery Address
        </label>
        <input
          id="deliveryAddress"
          type="text"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400"
          placeholder="48 Mercer Street, Apt 4B"
          [value]="deliveryAddress()"
          (input)="deliveryAddress.set($any($event.target).value)"
        />
      </div>

      <!-- City -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="city">
          City
        </label>
        <input
          id="city"
          type="text"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400"
          placeholder="New York"
          [value]="city()"
          (input)="city.set($any($event.target).value)"
        />
      </div>

      <!-- Postal Code -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="postalCode">
          Postal Code
        </label>
        <input
          id="postalCode"
          type="text"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400"
          placeholder="10013"
          [value]="postalCode()"
          (input)="postalCode.set($any($event.target).value)"
        />
      </div>

      <!-- Delivery Note -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold uppercase tracking-widest text-stone-700" for="deliveryNote">
          Delivery Note <span class="font-normal normal-case tracking-normal text-stone-400">· Optional</span>
        </label>
        <textarea
          id="deliveryNote"
          class="w-full px-4 py-3 text-sm text-stone-900 bg-white border border-stone-300 rounded focus:outline-none focus:border-stone-800 focus:ring-1 focus:ring-stone-800 transition placeholder-stone-400 resize-none"
          placeholder="Leave with the concierge if unavailable."
          rows="3"
          [value]="deliveryNote()"
          (input)="deliveryNote.set($any($event.target).value)"
        ></textarea>
      </div>
    </div>
  </div>
</div>
