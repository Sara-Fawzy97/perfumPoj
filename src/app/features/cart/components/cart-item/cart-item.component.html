<div class="flex items-center gap-4 py-4 border-b border-stone-200/80">
  <!-- Image -->
  <a [routerLink]="['/products', item().productId]" class="w-20 h-20 bg-stone-100 rounded-lg overflow-hidden shrink-0">
    <img
      [src]="item().imageUrl"
      [alt]="item().name"
      class="w-full h-full object-cover"
    />
  </a>

  <!-- Info -->
  <div class="flex-1 min-w-0">
    <p class="text-[11px] uppercase tracking-wider text-amber-800 font-medium">
      {{ item().brand }}
    </p>
    <h4 class="text-sm font-medium text-stone-900 truncate">
      <a [routerLink]="['/products', item().productId]" class="hover:underline">
        {{ item().name }}
      </a>
    </h4>
    <p class="text-xs text-stone-500 mt-0.5">
      {{ item().sizeMl }}ml Eau de Parfum
    </p>
    <p class="text-xs font-semibold text-stone-900 mt-1">
      {{ item().price | appPriceFormat }}
    </p>
  </div>

  <!-- Quantity Controls -->
  <div class="flex items-center gap-2 border border-stone-300 rounded-lg px-2 py-1 bg-white">
    <button
      type="button"
      (click)="onDecrement()"
      class="text-stone-500 hover:text-stone-800 p-0.5 disabled:opacity-30 cursor-pointer"
      aria-label="Decrease quantity"
    >
      -
    </button>
    <span class="text-xs font-semibold text-stone-800 w-5 text-center">
      {{ item().quantity }}
    </span>
    <button
      type="button"
      (click)="onIncrement()"
      class="text-stone-500 hover:text-stone-800 p-0.5 cursor-pointer"
      aria-label="Increase quantity"
    >
      +
    </button>
  </div>

  <!-- Line Item Total -->
  <div class="text-right w-20">
    <span class="text-sm font-semibold text-stone-900">
      {{ (item().price * item().quantity) | appPriceFormat }}
    </span>
  </div>

  <!-- Remove Button -->
  <button
    type="button"
    (click)="onRemove()"
    class="text-stone-400 hover:text-red-600 transition p-1 cursor-pointer"
    aria-label="Remove item"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
    </svg>
  </button>
</div>
