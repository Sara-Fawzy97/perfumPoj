<div class="min-h-screen bg-stone-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    @if (cartState.itemCount() === 0) {
      <!-- Empty Cart State -->
      <div class="text-center py-20 max-w-md mx-auto">
        <h1 class="font-serif text-4xl text-stone-900 mb-3">Checkout</h1>
        <p class="text-sm text-stone-500 mb-6">Your cart is empty. Add some items before checking out.</p>
        <a
          routerLink="/cart"
          class="inline-flex items-center gap-2 text-sm text-stone-700 hover:text-stone-900 underline underline-offset-4 transition"
        >
          ← Back to Cart
        </a>
      </div>
    } @else {
      <!-- Two-Column Checkout Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">

        <!-- Left Column: Delivery Details Form -->
        <div class="lg:col-span-7 bg-white rounded-xl border border-stone-200 p-8">
          <app-checkout-form />
        </div>

        <!-- Right Column: Payment + Order Summary -->
        <div class="lg:col-span-5 sticky top-24">
          <div class="bg-white rounded-xl border border-stone-200 p-8">
            <app-payment-section
              [subtotal]="cartState.subtotal()"
              [shipping]="cartState.shipping()"
              [total]="cartState.total()"
              [disabled]="isPlacingOrder"
              (placeOrder)="onPlaceOrder($event)"
            />
          </div>
        </div>

      </div>
    }

  </div>
</div>
