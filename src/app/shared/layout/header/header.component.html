<!-- Announcement Bar -->
<div class="bg-stone-950 text-stone-100 text-center text-[11px] tracking-[0.15em] uppercase font-medium py-2.5 px-4">
  Complimentary Signature Gift Wrapping on All Orders Above $150
</div>

<!-- Main Header -->
<header class="sticky top-0 z-40 bg-[#FAF8F5] border-b border-stone-200">
  <div class="max-w-[1440px] mx-auto px-10 h-[72px] flex items-center justify-between gap-8">

    <!-- Left Nav -->
    <nav class="flex items-center gap-8">
      <a routerLink="/products" class="text-[12px] font-semibold tracking-[0.12em] uppercase text-stone-900 hover:text-stone-600 transition-colors">
        Home
      </a>
      <a routerLink="/products" routerLinkActive="text-stone-900 border-b border-stone-900" class="text-[12px] font-medium tracking-[0.12em] uppercase text-stone-500 hover:text-stone-900 transition-colors">
        Shop
      </a>
      <a routerLink="/products" class="text-[12px] font-medium tracking-[0.12em] uppercase text-stone-500 hover:text-stone-900 transition-colors">
        Categories
      </a>
      <a routerLink="/products" class="text-[12px] font-medium tracking-[0.12em] uppercase text-stone-500 hover:text-stone-900 transition-colors">
        The Atelier
      </a>
    </nav>

    <!-- Center Logo -->
    <a routerLink="/products" class="absolute left-1/2 -translate-x-1/2">
      <span class="text-2xl font-serif tracking-[0.25em] uppercase text-stone-900 hover:text-stone-600 transition-colors">
        Odoratus
      </span>
    </a>

    <!-- Right Actions -->
    <div class="flex items-center gap-5">
      <!-- Search -->
      <div class="flex items-center gap-2 border border-stone-300 rounded-full px-3 py-1.5 bg-transparent min-w-[180px]">
        <svg class="w-3.5 h-3.5 text-stone-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-[11px] text-stone-400 tracking-wide">Search fragrances...</span>
      </div>

      <!-- Account icon -->
      <button class="text-stone-600 hover:text-stone-900 transition-colors" aria-label="Account">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </button>

      <!-- Cart -->
      <a routerLink="/cart" routerLinkActive="text-stone-900" class="relative text-stone-600 hover:text-stone-900 transition-colors" aria-label="Cart">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        @if (cartCount() > 0) {
          <span class="absolute -top-2 -right-2 inline-flex items-center justify-center w-4 h-4 text-[10px] font-bold text-white bg-stone-900 rounded-full">
            {{ cartCount() }}
          </span>
        }
      </a>
    </div>
  </div>
</header>
